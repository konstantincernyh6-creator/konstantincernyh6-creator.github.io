<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Суперкары</title>
    <style>
        body {
            margin: 0;
            background-color: #0f1015;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 30px;
        }
        /* Стили для кнопки авторизации */
        .auth-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .auth-btn:hover {
            background-color: #357ae8;
            transform: translateY(-2px);
        }
        .auth-btn:active {
            transform: translateY(0);
        }
        .user-info {
            margin-bottom: 20px;
            font-size: 16px;
            color: #00ffcc;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }
        .card {
            background: #1a1c23;
            border: 1px solid #333;
            border-radius: 12px;
            width: 280px;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .info {
            padding: 15px;
        }
        .info h3 {
            margin: 0 0 10px;
            color: #ff007f;
        }
        .info p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Легендарные Мощные Машины</h1>

    <!-- Кнопка авторизации и блок для имени пользователя -->
    <div id="user-profile" class="user-info"></div>
    <button type="button" id="google-login" class="auth-btn">Войти через Google</button>

    <div class="container">
        <div class="card">
            <img src="https://110km.ru" alt="Car">
            <div class="info">
                <h3>Neon GT</h3>
                <p>Быстрый спорткар с футуристичным дизайном и невероятной динамикой разгона.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://autotuni.ru" alt="Car">
            <div class="info">
                <h3>Viper R</h3>
                <p>Трековый зверь с ревом мощного мотора и агрессивным аэродинамическим обвесом.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://top-tuning.ru" alt="Car">
            <div class="info">
                <h3>Shadow X</h3>
                <p>Черная молния для ночных дорог. Совершенство стиля и высоких технологий.</p>
            </div>
        </div>
    </div>

    <script type="module">
        // ИСПРАВЛЕНО: Указаны точные, абсолютные CDN-пути к конкретным файлам библиотек Firebase v10
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider,
            GithubAuthProvider,
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Конфигурация вашего проекта Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDppXugKlNCW9eywWLJ65plk8k0Zq2wDxA",
            authDomain: "kode-1-76934.firebaseapp.com",
            projectId: "kode-1-76934",
            storageBucket: "kode-1-76934.firebasestorage.app",
            messagingSenderId: "872202056385",
            appId: "1:872202056385:web:41d61eae1ac1db24099a40",
            measurementId: "G-YXTPSXDFVK"
        };

        // Инициализация сервисов
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('google-login');
        const userProfile = document.getElementById('user-profile');

        // Логика кнопки (Вход / Выход)
        loginBtn.addEventListener('click', () => {
            if (!auth.currentUser) {
                signInWithPopup(auth, provider)
                    .then((result) => {
                        console.log("Успешный вход:", result.user);
                    })
                    .catch((error) => {
                        console.error("Ошибка авторизации:", error.code, error.message);
                        alert("Не удалось войти: " + error.message);
                    });
            } else {
                signOut(auth).then(() => {
                    console.log("Пользователь вышел");
                }).catch((error) => {
                    console.error("Ошибка при выходе:", error);
                });
            }
        });

        // Отслеживание состояния пользователя (Вошел или Вышел)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userProfile.textContent = `Привет, ${user.displayName}!`;
                loginBtn.textContent = "Выйти";
                loginBtn.style.backgroundColor = "#d9534f";
            } else {
                userProfile.textContent = "";
                loginBtn.textContent = "Войти через Google";
                loginBtn.style.backgroundColor = "#4285F4";
            }
        });
    </script>
</body>
</html>
